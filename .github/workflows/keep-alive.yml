name: Keep backend alive

# Render's free tier spins the service down after 15 minutes of inactivity.
# This pings /health every 10 minutes so it never sees that much idle time.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf -m 20 https://sarkari-saathi-2gg7.onrender.com/health
